<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEGOTTEN: LEMEGETON</title>
<link rel="stylesheet" href="css/loading.css">
</head>
<body>
<!--
	BEGOTTEN: LEMEGETON - connection screen (sv_loadingurl).
	Self-contained: no fonts, scripts or images from anywhere else, nothing from the game. See README.txt.
-->
<canvas id="scene"></canvas>
<div id="frame">
	<img id="logo" src="img/logo.png" alt="BEGOTTEN LEMEGETON">
	<div id="verse"><div id="verse-text"></div><div id="verse-ref"></div></div>
	<div id="status">
		<div id="status-word">The gate opens</div>
		<div id="thread"><div id="thread-fill"></div><div id="thread-spark"></div></div>
		<div id="status-detail"></div>
	</div>
	<div id="server"></div>
	<div id="map"></div>
	<div id="sound" title="Sound on / off"></div>
</div>
<script src="js/loading.js"></script>
</body>
</html>
